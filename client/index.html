<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation - Space Exploration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hud {
            position: fixed;
            z-index: 10;
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #0f0;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
        }

        .hud-top-left {
            top: 10px;
            left: 10px;
        }

        .hud-top-right {
            top: 10px;
            right: 10px;
            min-width: 120px;
        }

        .hud-bottom-left {
            bottom: 10px;
            left: 10px;
            max-width: 300px;
        }

        .hud-bottom-right {
            bottom: 10px;
            right: 10px;
            max-width: 250px;
            max-height: 400px;
            overflow-y: auto;
        }

        .hud-bottom-right h3 {
            margin-bottom: 10px;
            color: #0f0;
            font-size: 14px;
        }

        .outline-item {
            padding: 5px 10px;
            margin: 2px 0;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .outline-item:hover {
            background: rgba(0, 100, 0, 0.5);
            border-color: #0f0;
        }

        .outline-item.selected {
            background: rgba(0, 150, 0, 0.7);
            border-color: #0f0;
        }

        .outline-item.star {
            color: #ffff00;
            font-weight: bold;
        }

        .outline-item.planet {
            color: #0f0;
            padding-left: 20px;
        }

        .outline-item.ship {
            color: #00ffff;
            padding-left: 20px;
        }

        .outline-item.gate {
            color: #a855f7;
            padding-left: 20px;
            font-style: italic;
        }

        /* Custom scrollbar for outline */
        .hud-bottom-right::-webkit-scrollbar {
            width: 8px;
        }

        .hud-bottom-right::-webkit-scrollbar-track {
            background: rgba(0, 20, 0, 0.5);
        }

        .hud-bottom-right::-webkit-scrollbar-thumb {
            background: #0f0;
            border-radius: 4px;
        }

        .hud-bottom-right::-webkit-scrollbar-thumb:hover {
            background: #0a0;
        }

        .hud-button {
            background: rgba(0, 50, 0, 0.9);
            border: 1px solid #0f0;
            border-radius: 4px;
            color: #0f0;
            padding: 5px 10px;
            margin: 2px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.2s;
        }

        .hud-button:hover {
            background: rgba(0, 100, 0, 0.9);
        }

        .hud-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hud-button.active {
            background: rgba(0, 150, 0, 0.9);
        }

        #auth-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 0, 0.95);
            border: 2px solid #0f0;
            border-radius: 12px;
            padding: 30px;
            z-index: 100;
            min-width: 400px;
        }

        #auth-modal h2 {
            margin-bottom: 20px;
            color: #0f0;
        }

        #auth-modal input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            background: #001100;
            border: 1px solid #0f0;
            border-radius: 4px;
            color: #0f0;
            font-family: inherit;
        }

        #auth-modal button {
            width: 100%;
            margin: 5px 0;
        }

        .hidden {
            display: none;
        }

        .detail-row {
            margin: 5px 0;
        }

        .detail-label {
            color: #0a0;
        }

        .detail-value {
            color: #0f0;
        }

        #error-message {
            color: #f00;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Auth Modal -->
    <div id="auth-modal">
        <h2>Constellation</h2>
        <div id="error-message" class="hidden"></div>
        <input type="text" id="galaxy-name" placeholder="Galaxy Name (default: the Milky Way)" />
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="hud-button" id="reset-galaxy" style="flex: 1;">Reset Galaxy</button>
            <button class="hud-button" id="explore-galaxy" style="flex: 1;">Explore</button>
        </div>
    </div>

    <!-- Top Left Navigation -->
    <div class="hud hud-top-left">
        <button class="hud-button" id="nav-home">Home</button>
        <button class="hud-button active" id="nav-system">System</button>
        <button class="hud-button" id="nav-constellation" disabled>Constellation</button>
    </div>

    <!-- Top Right Time Controls -->
    <div class="hud hud-top-right">
        <div>Time: <span id="time-display">0d 0h</span></div>
        <div>Scale: <span id="time-scale">1000x</span></div>
        <button class="hud-button" id="time-toggle">Pause</button>
    </div>

    <!-- Bottom Left Details Panel - Celestial Bodies -->
    <div class="hud hud-bottom-left hidden" id="body-details-panel">
        <h3 id="body-detail-name">-</h3>
        <div class="detail-row">
            <span class="detail-label">Type:</span>
            <span class="detail-value" id="body-detail-type">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Mass:</span>
            <span class="detail-value" id="body-detail-mass">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Radius:</span>
            <span class="detail-value" id="body-detail-radius">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Distance:</span>
            <span class="detail-value" id="body-detail-distance">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Velocity:</span>
            <span class="detail-value" id="body-detail-velocity">-</span>
        </div>
    </div>

    <!-- Bottom Left Details Panel - Star Gates -->
    <div class="hud hud-bottom-left hidden" id="gate-details-panel">
        <h3 id="gate-detail-name">-</h3>
        <div class="detail-row">
            <span class="detail-label">Type:</span>
            <span class="detail-value" id="gate-detail-type">Star Gate</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Status:</span>
            <span class="detail-value" id="gate-detail-status">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Leads to:</span>
            <span class="detail-value" id="gate-detail-destination">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Distance:</span>
            <span class="detail-value" id="gate-detail-distance">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Orbital Period:</span>
            <span class="detail-value" id="gate-detail-period">-</span>
        </div>
    </div>

    <!-- Bottom Right System Outline -->
    <div class="hud hud-bottom-right hidden" id="system-outline">
        <div id="outline-list"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
