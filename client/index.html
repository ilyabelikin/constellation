<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation - Space Exploration</title>
    <style>
        :root {
            /* Default green theme (for initial screen) */
            --primary-color: #0f0;
            --primary-color-dim: #0a0;
            --primary-color-dark: rgba(0, 20, 0, 0.8);
            --primary-color-darker: rgba(0, 50, 0, 0.9);
            --primary-color-darkest: #001100;
            --primary-color-hover: rgba(0, 100, 0, 0.5);
            --primary-color-hover-solid: rgba(0, 100, 0, 0.9);
            --primary-color-selected: rgba(0, 150, 0, 0.7);
            --primary-color-active: rgba(0, 150, 0, 0.9);
            --primary-color-scrollbar-track: rgba(0, 20, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: var(--primary-color);
            overflow: hidden;
            transition: color 0.8s ease;
        }

        /* Suppress theme transitions on initial load */
        body.no-theme-transition * {
            transition: none !important;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hud {
            position: fixed;
            z-index: 10;
            background: var(--primary-color-dark);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            transition: background 0.8s ease, border-color 0.8s ease;
        }

        .hud-top-left {
            top: 10px;
            left: 10px;
        }

        .hud-top-right {
            top: 10px;
            right: 10px;
            min-width: 120px;
        }

        .hud-bottom-left {
            bottom: 10px;
            left: 10px;
            max-width: 300px;
        }

        .hud-bottom-right {
            bottom: 10px;
            right: 10px;
            max-width: 250px;
            max-height: calc(100vh - 120px); /* Grow up to near the time widget */
            overflow-y: auto;
        }

        .hud-bottom-right h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
            font-size: 14px;
            transition: color 0.8s ease;
        }

        .outline-item {
            padding: 5px 10px;
            margin: 2px 0;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .outline-item:hover {
            background: var(--primary-color-hover);
            border-color: var(--primary-color);
        }

        .outline-item.selected {
            background: var(--primary-color-selected);
            border-color: var(--primary-color);
        }

        .outline-item.star {
            color: #ffff00;
            font-weight: bold;
        }

        .outline-item.planet {
            color: var(--primary-color);
            padding-left: 20px;
            transition: color 0.8s ease;
        }

        .outline-item.moon {
            color: var(--primary-color);
            padding-left: 20px;
            transition: color 0.8s ease;
        }

        .outline-item.asteroid-belt {
            color: var(--primary-color);
            transition: color 0.8s ease;
        }

        .outline-item.ship {
            color: #00ffff;
            padding-left: 20px;
        }

        .outline-item.gate {
            color: #a855f7;
            padding-left: 20px;
            font-style: italic;
        }

        /* Custom scrollbar for outline */
        .hud-bottom-right::-webkit-scrollbar {
            width: 8px;
        }

        .hud-bottom-right::-webkit-scrollbar-track {
            background: var(--primary-color-scrollbar-track);
        }

        .hud-bottom-right::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .hud-bottom-right::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color-dim);
        }

        .hud-button {
            background: var(--primary-color-darker);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            color: var(--primary-color);
            padding: 5px 10px;
            margin: 2px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .hud-button:hover {
            background: var(--primary-color-hover-solid);
        }

        .hud-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hud-button.active {
            background: var(--primary-color-active);
        }

        #auth-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 0, 0.95);
            border: 2px solid #0f0;
            border-radius: 12px;
            padding: 30px;
            z-index: 100;
            min-width: 400px;
        }

        #auth-modal h2 {
            margin-bottom: 20px;
            color: #0f0;
        }

        #auth-modal input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            background: var(--primary-color-darkest);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            color: var(--primary-color);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        #auth-modal button {
            width: 100%;
            margin: 5px 0;
        }

        .hidden {
            display: none;
        }

        /* Hide game HUD elements when auth modal is visible */
        .hud-top-left,
        .hud-top-right {
            display: none;
        }

        .hud-top-left.visible,
        .hud-top-right.visible {
            display: block;
        }

        #galaxy-time-display {
            margin-top: 10px;
            font-size: 11px;
            color: var(--primary-color-dim);
            text-align: center;
        }

        .detail-row {
            margin: 5px 0;
        }

        .detail-label {
            color: var(--primary-color-dim);
            transition: color 0.8s ease;
        }

        .detail-value {
            color: var(--primary-color);
            transition: color 0.8s ease;
        }

        #error-message {
            color: #f00;
            margin: 10px 0;
        }

        /* Search Modal */
        #search-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
        }

        #search-modal:not(.hidden) {
            display: flex; /* Show as flex when not hidden */
        }

        #search-modal-content {
            background: var(--primary-color-dark);
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 20px;
            min-width: 500px;
            max-width: 700px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        #search-modal-content h3 {
            margin: 0 0 15px 0;
            color: var(--primary-color);
            font-size: 16px;
        }

        #search-input {
            width: 100%;
            padding: 10px;
            background: var(--primary-color-darkest);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            color: var(--primary-color);
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px var(--primary-color);
        }

        #search-results {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            margin-bottom: 10px;
        }

        .search-result-item {
            padding: 10px;
            margin: 5px 0;
            background: var(--primary-color-darker);
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result-item:hover {
            background: var(--primary-color-hover-solid);
            border-color: var(--primary-color);
        }

        .search-result-name {
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 3px;
        }

        .search-result-details {
            color: var(--primary-color-dim);
            font-size: 11px;
        }

        #search-help {
            color: var(--primary-color-dim);
            font-size: 11px;
            text-align: center;
        }

        #search-results::-webkit-scrollbar {
            width: 8px;
        }

        #search-results::-webkit-scrollbar-track {
            background: var(--primary-color-scrollbar-track);
        }

        #search-results::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }

        #search-results::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color-dim);
        }

        #search-button {
            padding: 5px 8px;
            display: none; /* Hidden by default, shown when game starts */
            align-items: center;
            justify-content: center;
        }

        #search-button.visible {
            display: flex;
        }

        #search-button svg {
            display: block;
        }
    </style>
</head>
<body class="no-theme-transition">
    <div id="canvas-container"></div>

    <!-- Auth Modal -->
    <div id="auth-modal">
        <h2>Constellation</h2>
        <div id="error-message" class="hidden"></div>
        <input type="text" id="galaxy-name" placeholder="Galaxy Name (default: the Milky Way)" />
        <div id="galaxy-time-display"></div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="hud-button" id="reset-galaxy" style="flex: 1;">Reset Galaxy</button>
            <button class="hud-button" id="explore-galaxy" style="flex: 1;">Explore</button>
        </div>
    </div>

    <!-- Top Left Navigation -->
    <div class="hud hud-top-left">
        <button class="hud-button" id="nav-home">Home</button>
        <button class="hud-button active" id="nav-system">System</button>
        <button class="hud-button" id="nav-constellation">Constellation</button>
    </div>

    <!-- Top Right Time Controls -->
    <div class="hud hud-top-right">
        <div>Time: <span id="time-display">0d 0h</span></div>
        <div>Scale: <span id="time-scale">1000x</span></div>
        <button class="hud-button" id="time-toggle">Pause</button>
        <button class="hud-button" id="search-button" title="Search (F)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <!-- Bottom Left Details Panel - Celestial Bodies -->
    <div class="hud hud-bottom-left hidden" id="body-details-panel">
        <h3 id="body-detail-name">-</h3>
        <div class="detail-row">
            <span class="detail-label">Type:</span>
            <span class="detail-value" id="body-detail-type">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Mass:</span>
            <span class="detail-value" id="body-detail-mass">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Radius:</span>
            <span class="detail-value" id="body-detail-radius">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Distance:</span>
            <span class="detail-value" id="body-detail-distance">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Velocity:</span>
            <span class="detail-value" id="body-detail-velocity">-</span>
        </div>
        <div class="detail-value" id="body-detail-life" style="display: none; margin-top: 0.5rem;">-</div>
        <div class="detail-value" id="body-detail-habitability" style="display: none;">-</div>
        <div class="detail-value" id="body-detail-composition" style="display: none;">-</div>
        <div class="detail-value" id="body-detail-shape" style="display: none;">-</div>
    </div>

    <!-- Bottom Left Details Panel - Star Gates -->
    <div class="hud hud-bottom-left hidden" id="gate-details-panel">
        <h3 id="gate-detail-name">-</h3>
        <div class="detail-row">
            <span class="detail-label">Type:</span>
            <span class="detail-value" id="gate-detail-type">Star Gate</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Status:</span>
            <span class="detail-value" id="gate-detail-status">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Leads to:</span>
            <span class="detail-value" id="gate-detail-destination">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Distance:</span>
            <span class="detail-value" id="gate-detail-distance">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Orbital Period:</span>
            <span class="detail-value" id="gate-detail-period">-</span>
        </div>
    </div>

    <!-- Bottom Left Details Panel - Ships -->
    <div class="hud hud-bottom-left hidden" id="ship-details-panel">
        <h3 id="ship-detail-name">-</h3>
        <div class="detail-row">
            <span class="detail-label">Type:</span>
            <span class="detail-value" id="ship-detail-type">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-value" id="ship-detail-parent">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-value" id="ship-detail-distance">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-value" id="ship-detail-velocity">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-value" id="ship-detail-deltav">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-value" id="ship-detail-period">-</span>
        </div>
    </div>

    <!-- Bottom Left Details Panel - Constellation Systems -->
    <div class="hud hud-bottom-left hidden" id="constellation-system-panel">
        <h3 id="constellation-system-name">-</h3>
        <div class="detail-row">
            <span class="detail-label">Star Type:</span>
            <span class="detail-value" id="constellation-star-type">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Mass:</span>
            <span class="detail-value" id="constellation-star-mass">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Jumps from home:</span>
            <span class="detail-value" id="constellation-jumps">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Planets:</span>
            <span class="detail-value" id="constellation-planets">-</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Gates:</span>
            <span class="detail-value" id="constellation-gates">-</span>
        </div>
    </div>

    <!-- Bottom Right System Outline -->
    <div class="hud hud-bottom-right hidden" id="system-outline">
        <div id="outline-list"></div>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="hidden">
        <div id="search-modal-content">
            <h3>Search Objects</h3>
            <input type="text" id="search-input" placeholder="Search for stars, planets, asteroids..." />
            <div id="search-results"></div>
            <div id="search-help">Press Esc to close</div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
